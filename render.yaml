# One-click Render deployment for a MOVA demo:
# one web service runs the website (public) and the API (internal, port 4000),
# plus a free PostgreSQL database and a free Redis-compatible key value store.
services:
  - type: web
    name: mova
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --prod=false && pnpm --filter @mova/web build
    region: frankfurt
    startCommand: >-
      cd apps/api && npx tsx src/db/seed.ts &&
      (PORT=4000 npx tsx src/server.ts &) &&
      cd ../web && npx next start -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: API_URL
        value: http://127.0.0.1:4000
      - key: JWT_SECRET
        generateValue: true
      # Demo deployment: payments use MOVA's labelled test checkout until a Paystack key is added.
      - key: ALLOW_TEST_PAYMENTS
        value: "true"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mova-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mova-redis
          property: connectionString

  - type: keyvalue
    name: mova-redis
    plan: free
    region: frankfurt
    ipAllowList: []

databases:
  - name: mova-db
    plan: free
    region: frankfurt
    databaseName: mova
    user: mova
