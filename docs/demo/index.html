/* Animated brand gradients. Only palette hues (Electric, Violet, Aqua and their shades);
   slow, eased loops; frozen by the global prefers-reduced-motion rule in globals.css. */
@keyframes mova-flow {
  0% { background-position: 0% 40%; }
  50% { background-position: 100% 60%; }
  100% { background-position: 0% 40%; }
}
@keyframes mova-drift-a {
  0% { transform: translate3d(0, 0, 0) scale(1); }
  50% { transform: translate3d(-12%, 10%, 0) scale(1.12); }
  100% { transform: translate3d(0, 0, 0) scale(1); }
}
@keyframes mova-drift-b {
  0% { transform: translate3d(0, 0, 0) scale(1.05); }
  50% { transform: translate3d(14%, -8%, 0) scale(0.95); }
  100% { transform: translate3d(0, 0, 0) scale(1.05); }
}
@keyframes mova-ambient {
  0% { transform: translate3d(0, 0, 0) rotate(0deg); }
  33% { transform: translate3d(3%, -2%, 0) rotate(4deg); }
  66% { transform: translate3d(-3%, 2%, 0) rotate(-3deg); }
  100% { transform: translate3d(0, 0, 0) rotate(0deg); }
}

/* Hero and auth panel: the Electric → Violet field slowly breathes through its own shades. */
.mova-flow {
  background-color: #493bff;
  background-image: linear-gradient(120deg, #493bff 0%, #5a3dff 22%, #8655ff 45%, #6c48ff 62%, #3f33e6 80%, #493bff 100%);
  background-size: 260% 260%;
  animation: mova-flow 22s ease-in-out infinite;
}
:root[data-theme="dark"] .mova-flow {
  background-color: #2b20c4;
  background-image: linear-gradient(120deg, #2b20c4 0%, #3a23b8 22%, #5a2fd6 45%, #4326c9 62%, #241a9e 80%, #2b20c4 100%);
}

/* Call-to-action band: Electric drifting toward an aqua horizon. */
.mova-flow-cta {
  background-color: #493bff;
  background-image: linear-gradient(120deg, #493bff 0%, #3a2df0 30%, #5a3dff 50%, #2f8fe6 78%, #12d6c5 100%);
  background-size: 220% 220%;
  animation: mova-flow 26s ease-in-out infinite;
}

/* Soft colour glows drifting over a brand field. */
.mova-drift-a { animation: mova-drift-a 28s ease-in-out infinite; will-change: transform; }
.mova-drift-b { animation: mova-drift-b 34s ease-in-out infinite; will-change: transform; }

/* Page ground: a faint violet / aqua / electric wash drifting behind the content. */
body::before {
  content: "";
  position: fixed;
  inset: -25%;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(38% 32% at 18% 22%, rgb(134 85 255 / 0.13), transparent 70%),
    radial-gradient(34% 30% at 82% 30%, rgb(18 214 197 / 0.11), transparent 70%),
    radial-gradient(42% 36% at 55% 85%, rgb(73 59 255 / 0.1), transparent 70%);
  animation: mova-ambient 60s ease-in-out infinite;
  will-change: transform;
}
:root[data-theme="dark"] body::before {
  background:
    radial-gradient(38% 32% at 18% 22%, rgb(134 85 255 / 0.18), transparent 70%),
    radial-gradient(34% 30% at 82% 30%, rgb(18 214 197 / 0.1), transparent 70%),
    radial-gradient(42% 36% at 55% 85%, rgb(73 59 255 / 0.16), transparent 70%);
}
@media print {
  body::before { display: none; }
}

@media (prefers-reduced-motion:reduce){.mova-flow,.mova-flow-cta,.mova-drift-a,.mova-drift-b,body::before{animation:none!important}}

        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {

              bytes.push(b & 0xff);

          }

    <section id="home-how" class="py-20"><div class="wrap"><h2 class="text-3xl font-extrabold sm:text-[2.6rem] sm:leading-[1.1]">From seat to bus door in four steps</h2><p class="mt-3 max-w-2xl text-lg text-muted">No queues at the station and no cash. Everything you need to travel is on your phone.</p>
      <ol class="mt-10 grid gap-3 md:grid-cols-4">${steps.map(([t, b], i) => `<li><button data-step="${i}" aria-pressed="${S.step === i}" class="h-full w-full rounded-2xl p-4 text-left transition ${S.step === i ? "bg-surface shadow-soft" : "hover:bg-surface/60"}"><span class="grid size-9 place-items-center rounded-full border-2 font-bold ${S.step === i ? "border-electric bg-electric text-white" : i < S.step ? "border-route text-route" : "border-line text-muted"}">${i + 1}</span><b class="mt-3 block font-display text-lg">${t}</b><span class="mt-1 block text-[15px] text-muted">${b}</span></button></li>`).join("")}</ol>
      <div class="mt-3 h-1 rounded-full bg-line"><div class="h-1 rounded-full bg-route transition-all duration-500" style="width:${(S.step + 1) * 25}%"></div></div></div></section>
    <section class="bg-surface py-20"><div class="wrap"><div class="mb-8 flex flex-wrap items-end justify-between gap-3"><div><h2 class="text-3xl font-extrabold sm:text-[2.6rem]">Upcoming trips</h2><p class="mt-2 text-lg text-muted">Departures you can book right now.</p></div><a href="#trips" class="btn btn-o">See all trips ${icon(I.arrow, "size-4")}</a></div>
      <div class="grid gap-4 lg:grid-cols-2">${trips.slice(0, 4).map(tripCard).join("")}</div></div></section>
    <section class="py-20"><div class="wrap grid gap-4 lg:grid-cols-2">${[["inter", "Going home for vacation", "Inter-regional coaches from campus to cities across Ghana. Book early to get the seat you want.", true], ["shuttle", "Getting around campus", "Campus shuttles between halls, faculties and town, with the same seat booking and QR tickets.", false]].map(([ty, h, p, dark]) => { const ts = trips.filter(t => t.type === ty); const stops = [...new Set(ts.flatMap(t => ty === "inter" ? [t.destination] : [t.origin, t.destination]))]; return `<a href="#trips" data-type="${ty}" class="flex flex-col rounded-[28px] p-8 sm:p-10 ${dark ? "bg-ink text-white bg-[radial-gradient(120%_90%_at_100%_0%,rgba(134,85,255,.55),transparent_60%)]" : "border border-line bg-surface"}"><h2 class="text-3xl font-extrabold">${h}</h2><p class="mt-2 ${dark ? "text-white/75" : "text-muted"}">${p}</p>
      <ol class="relative my-8 flex flex-col gap-3"><span class="absolute top-2 bottom-2 left-[5px] w-0.5 dash-v"></span>${stops.slice(0, 4).map(s => `<li class="relative flex items-center gap-3 font-display text-xl font-bold"><span class="size-3 rounded-full bg-aqua"></span>${s}</li>`).join("")}${stops.length > 4 ? `<li class="pl-6 text-sm opacity-70">and ${stops.length - 4} more</li>` : ""}</ol>
      <dl class="mt-auto grid grid-cols-3 gap-4 border-t pt-5 ${dark ? "border-white/15" : "border-line"}"><div><dt class="text-sm opacity-70">Fares from</dt><dd class="tab font-display text-lg font-bold">${cedis(Math.min(...ts.map(t => t.fare)))}</dd></div><div><dt class="text-sm opacity-70">Next departure</dt><dd class="tab font-display text-lg font-bold">${fmtD(ts[0].dep)} · ${fmtT(ts[0].dep)}</dd></div><div><dt class="text-sm opacity-70">Departures</dt><dd class="tab font-display text-lg font-bold">${ts.length}</dd></div></dl>
      <span class="pt-6 font-semibold ${dark ? "text-aqua" : "text-accent-fg"}">Find trips →</span></a>`; }).join("")}</div></section>
    <section class="wrap pb-6"><div class="rounded-[32px] mova-flow-cta px-8 py-14 text-white sm:px-14"><h2 class="max-w-xl text-3xl font-extrabold sm:text-[2.6rem] sm:leading-[1.1]">Your next trip starts with a seat.</h2><p class="mt-3 text-lg text-white/90">Create a free account with your UCC student ID and book in minutes.</p><div class="mt-8 flex flex-wrap gap-3"><a href="#trips" class="btn btn-l h-13">Find available trips</a></div></div></section>${footer()}`,

  trips: () => { let list = trips.filter(t => (!S.search.origin || t.origin.toLowerCase().includes(S.search.origin.toLowerCase())) && (!S.search.destination || t.destination.toLowerCase().includes(S.search.destination.toLowerCase())) && (!S.search.date || t.dep.toISOString().slice(0, 10) === S.search.date) && (!S.type || t.type === S.type));
    return `${header()}<section class="border-b border-line bg-surface"><div class="wrap py-8"><h1 class="text-2xl font-extrabold sm:text-3xl">Find a trip</h1><div class="mt-5">${searchForm(true)}</div></div></section>
    <section class="wrap py-8"><div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"><p class="text-[15px] text-muted"><b class="text-fg">${list.length} ${list.length === 1 ? "trip" : "trips"}</b> departing soon</p>
      <div class="flex gap-2">${[["", "All trips"], ["inter", "Inter-regional"], ["shuttle", "Campus shuttle"]].map(([v, l]) => `<button data-filter="${v}" class="rounded-full border px-4 py-2 text-sm font-semibold ${S.type === v ? "border-electric bg-electric text-white" : "border-line bg-surface text-muted"}">${l}</button>`).join("")}</div></div>
      ${list.length ? `<div class="grid gap-4">${list.map(tripCard).join("")}</div>` : `<div class="rounded-[18px] border border-dashed border-line bg-surface px-6 py-12 text-center"><h3 class="text-lg font-bold">No trips match those details.</h3><p class="mt-1.5 text-muted">Try another date or destination, or clear the search to see every upcoming trip.</p><button data-clear class="btn btn-o mt-5">Clear search</button></div>`}</section>${footer()}`; },

  trip: id => { const t = trips.find(x => x.id === id); if (!t) return pages.home(); const held = S.hold && S.hold.trip === t.id ? S.hold.seat : null; const lugFee = LUG.find(l => l[0] === S.lug)[2];
    return `${header()}<div class="wrap py-6 sm:py-10"><a href="#trips" class="inline-flex items-center gap-1.5 text-sm font-semibold text-muted">${icon(I.back, "size-4")} All trips</a>
    <header class="mt-4 mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between"><div><div class="mb-2 flex gap-2">${typeBadge(t)}${demo}</div><h1 class="text-3xl font-extrabold sm:text-4xl">${t.origin} <span class="text-route">→</span> ${t.destination}</h1><p class="mt-2 text-[15px] text-muted">${fmtD(t.dep)} at <b class="tab text-fg">${fmtT(t.dep)}</b> · ${t.plate} · ${t.operator}</p></div><p class="sm:text-right"><span class="block text-sm text-muted">Fare per seat</span><span class="tab font-display text-3xl font-extrabold">${cedis(t.fare)}</span></p></header>
    <div class="grid items-start gap-8 lg:grid-cols-[minmax(0,1fr)_400px]"><section class="card p-5 sm:p-8"><h2 class="text-xl font-bold">Choose your seat</h2><p class="mt-2 text-[15px] text-muted">${seatsLeft(t)} of ${t.cap} seats available. Tap a seat to hold it for 10 minutes.</p>
      <ul class="mt-3 flex flex-wrap gap-x-5 gap-y-2 text-sm">${[["seat-a", "Available"], ["seat-s", "Your seat"], ["seat-l", "Temporarily unavailable"], ["seat-b", "Booked"]].map(([c, l]) => `<li class="flex items-center gap-2"><span class="seat ${c} !size-6 !cursor-default"></span>${l}</li>`).join("")}</ul>
      <div class="mx-auto mt-6 w-full max-w-[340px] rounded-[28px] border-2 border-line bg-ground p-4 sm:p-5"><div class="mb-4 flex justify-between border-b-2 border-dashed border-line pb-3 text-xs font-semibold text-muted"><span>Front of bus</span><span>Driver</span></div>
        <div class="grid grid-cols-5 gap-2" role="grid" aria-label="Seat map">${layout(t.cap).flat().map(n => { if (!n) return "<span></span>"; const st = n === held ? "s" : t.booked.has(n) ? "b" : t.locked.has(n) ? "l" : "a"; const label = { a: "Available", s: "Selected", b: "Booked", l: "Temporarily unavailable" }[st]; return `<button class="seat seat-${st}" ${st === "a" ? `data-seat="${n}"` : st === "s" ? "" : "disabled"} aria-label="Seat ${n}, ${label}">${st === "a" || st === "s" ? n : st === "b" ? icon(I.x, "size-3.5") : icon(I.timer, "size-3.5")}</button>`; }).join("")}</div>
        <p class="mt-4 border-t-2 border-dashed border-line pt-3 text-center text-xs font-semibold text-muted">Back of bus</p></div></section>
      <section class="card overflow-hidden lg:sticky lg:top-16"><div class="border-b border-line p-5 sm:p-6"><h2 class="text-xl font-bold">Booking summary</h2><p class="mt-1 text-[15px] ${held ? "" : "text-muted"}">${held ? `Seat <b class="tab">${held}</b> selected` : "No seat selected yet."}</p></div>
        <div class="flex flex-col gap-5 p-5 sm:p-6">${S.expired ? `<p role="status" class="rounded-2xl bg-warning-bg p-4 text-[15px]"><b>Your seat hold has expired.</b> Please choose a seat again.</p>` : ""}${held ? `<div class="rounded-2xl bg-success-bg p-3.5" id="hold"></div>` : ""}
          <fieldset ${held ? "" : "disabled"} class="disabled:opacity-60"><legend class="mb-2 text-sm font-semibold">Luggage</legend><div class="grid gap-2">${LUG.map(([v, l, f]) => `<label class="flex cursor-pointer items-center gap-3 rounded-xl border p-3 ${S.lug === v ? "border-electric bg-info-bg" : "border-line"}"><input type="radio" name="lug" value="${v}" ${S.lug === v ? "checked" : ""} class="size-4 accent-[#493bff]"><span class="flex-1 text-[15px]">${l}</span><span class="tab text-sm font-semibold text-muted">${f ? "+ " + cedis(f) : "Free"}</span></label>`).join("")}</div></fieldset>
          <dl class="space-y-2 text-[15px]"><div class="flex justify-between"><dt class="text-muted">Trip fare</dt><dd class="tab">${cedis(t.fare)}</dd></div><div class="flex justify-between"><dt class="text-muted">Luggage</dt><dd class="tab">${cedis(lugFee)}</dd></div><div class="flex justify-between border-t border-line pt-3 text-lg font-bold"><dt>Total</dt><dd class="tab">${cedis(t.fare + lugFee)}</dd></div></dl>
          <button class="btn btn-p h-13 text-base" data-go="checkout" ${held ? "" : "disabled"}>Continue to payment ${icon(I.arrow, "size-4")}</button>${held ? `<button data-release class="text-sm font-semibold text-muted hover:underline">Release this seat</button>` : ""}
          <p class="text-xs text-muted">You pay with mobile money or card through Paystack. Your ticket is issued only after your payment is confirmed.</p></div></section></div></div>${footer()}`; },

  checkout: () => { if (!S.hold) return pages.trips(); const t = trips.find(x => x.id === S.hold.trip); const amt = t.fare + LUG.find(l => l[0] === S.lug)[2];
    return `${header()}<div class="wrap max-w-lg py-12"><p role="status" class="mb-6 rounded-2xl border border-warning/25 bg-warning-bg p-4 text-[15px]"><b class="block">Test mode — no real money moves</b><span class="text-muted">Paystack isn't connected yet, so this page stands in for the Paystack checkout.</span></p>
      <div class="card p-6"><h1 class="text-xl font-bold">Test payment</h1><p class="tab text-sm text-muted">MOVA-${S.hold.ref}</p><p class="mt-6 text-sm text-muted">Amount</p><p class="tab font-display text-3xl font-extrabold">${cedis(amt)}</p>
      <div class="mt-6 grid gap-2"><button class="btn btn-p h-13" data-pay="success">Simulate successful payment</button><button class="btn btn-o" data-pay="failed">Simulate failed payment</button></div></div></div>`; },

  pending: () => `${header()}<div class="wrap max-w-2xl py-16 text-center" role="status"><span class="mx-auto grid size-16 place-items-center rounded-full bg-info-bg text-accent-fg"><svg class="size-8 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg></span><h1 class="mt-5 text-3xl font-extrabold">We're confirming your payment.</h1><p class="mt-3 text-muted">Please keep this page open and don't try to pay again.</p></div>`,

  failed: () => `${header()}<div class="wrap max-w-2xl py-16 text-center"><span class="mx-auto grid size-16 place-items-center rounded-full bg-danger-bg text-danger">${icon(I.x, "size-8")}</span><h1 class="mt-5 text-3xl font-extrabold">Payment wasn't completed.</h1><p class="mt-3 text-muted">You haven't been charged. Your seat is still held, so you can try again.</p><div class="mt-6 flex justify-center gap-3"><a href="#checkout" class="btn btn-p h-13">Try payment again</a><a href="#help" class="btn btn-o h-13">Get help</a></div></div>`,

  confirmed: () => { const tk = S.tickets[0]; return `${header()}<div class="wrap max-w-2xl py-12 text-center"><span class="mx-auto grid size-20 place-items-center rounded-full bg-success-bg text-success"><svg viewBox="0 0 24 24" class="size-10"><path class="draw" d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <h1 class="mt-5 text-3xl font-extrabold">Your booking is confirmed.</h1><p class="mt-2 text-muted">Your ticket is ready. You'll also find it in My tickets.</p><div class="mt-8">${ticket(tk)}</div><div class="mt-8 flex flex-wrap justify-center gap-3"><a href="#tickets" class="btn btn-p h-13">Go to My tickets ${icon(I.arrow, "size-4")}</a><a href="#trips" class="btn btn-o h-13">Book another trip</a></div></div>`; },

  tickets: () => `${header()}<div class="wrap max-w-3xl py-10"><h1 class="text-2xl font-extrabold sm:text-3xl">My tickets</h1><p class="mt-1.5 text-muted">Show the QR code to your driver when you board.</p>
    ${S.tickets.length ? `<div class="mt-6 grid gap-3">${S.tickets.map(tk => `<a href="#ticket-${tk.ref}" class="card flex items-center gap-4 p-4 transition hover:-translate-y-0.5 hover:shadow-lift"><span class="grid size-14 shrink-0 place-items-center rounded-2xl bg-info-bg text-center"><span class="text-[11px] font-semibold text-muted">Seat</span><b class="tab -mt-1 font-display text-xl text-accent-fg">${tk.seat}</b></span><span class="flex-1"><b class="block font-display text-lg">${tk.t.origin} → ${tk.t.destination}</b><span class="text-sm text-muted">${fmtD(tk.t.dep)} · ${fmtT(tk.t.dep)} · ${tk.t.plate}</span></span>${tk.boarded ? '<span class="badge text-muted">Boarded</span>' : '<span class="badge text-success bg-success-bg">Confirmed</span>'}</a>`).join("")}</div>`
      : `<div class="mt-6 rounded-[18px] border border-dashed border-line bg-surface px-6 py-12 text-center"><h3 class="text-lg font-bold">No tickets yet</h3><p class="mt-1.5 text-muted">Book a seat and your QR ticket appears here as soon as your payment is confirmed.</p><a href="#trips" class="btn btn-p mt-5">Find available trips</a></div>`}</div>${footer()}`,

  ticket: ref => { const tk = S.tickets.find(x => x.ref === ref); return tk ? `${header()}<div class="wrap max-w-xl py-10"><a href="#tickets" class="mb-6 inline-flex items-center gap-1.5 text-sm font-semibold text-muted">${icon(I.back, "size-4")} My tickets</a>${ticket(tk)}</div>${footer()}` : pages.tickets(); },

  help: () => `${header()}<div class="wrap max-w-3xl py-14"><h1 class="text-3xl font-extrabold sm:text-4xl">Help and FAQs</h1>${[["How long is my seat held?", "Ten minutes from when you choose it. A countdown shows how much time is left. If it runs out, the seat is released."], ["What if my payment is still pending?", "Keep the payment page open and don't pay again. Mobile money approvals can take a minute."], ["What if someone else gets my seat while I'm paying?", "If the seat is gone when your payment completes, your payment is refunded."], ["Do I need to print my ticket?", "No. Show the QR code on your phone. The details are also shown as text."]].map(([q, a]) => `<details class="border-b border-line py-5"><summary class="cursor-pointer font-display text-lg font-bold">${q}</summary><p class="mt-3 text-[15px] text-muted">${a}</p></details>`).join("")}</div>${footer()}`,

  driver: () => { const dt = trips.filter(t => t.plate === "DEMO-GR 1002-26"); return `${appHead("Driver · Esi Demo")}<div class="wrap max-w-3xl py-10"><h1 class="text-2xl font-extrabold sm:text-3xl">My trips</h1><p class="mt-1.5 text-muted">Trips assigned to your bus. Open the scanner to board passengers.</p><div class="mt-6 grid gap-4">${dt.map(t => { const all = [...t.booked.values(), ...S.tickets.filter(k => k.t === t)]; return `<div class="card p-5"><div class="flex justify-between gap-3"><div><p class="tab font-display text-2xl font-extrabold">${fmtT(t.dep)} <span class="text-base font-semibold text-muted" style="margin-left:.375rem">${fmtD(t.dep)}</span></p><p class="mt-1 font-display text-lg font-bold">${t.origin} → ${t.destination}</p><p class="text-sm text-muted">${t.plate}</p></div>${demo}</div><div class="mt-4 flex flex-wrap items-center justify-between gap-3 border-t border-line pt-4"><p class="text-[15px]"><b class="tab">${all.filter(p => p.boarded).length} of ${all.length}</b> boarded</p><a href="#scan-${t.id}" class="btn btn-p h-13">${icon(I.scan)} Scan tickets</a></div></div>`; }).join("")}</div></div>`; },

  scan: id => { const t = trips.find(x => x.id === id) || trips[1]; const mine = S.tickets.find(k => k.t === t);

    <div class="mt-5 grid aspect-square w-full place-items-center rounded-[28px] bg-ink p-8 text-center text-white"><div>${icon(I.scan, "mx-auto size-12 text-aqua")}<p class="mx-auto mt-4 max-w-xs text-white/80">The real app uses your phone's back camera here. In this demo, pick a ticket below to "scan" it.</p></div></div>
    <div class="card mt-6 p-5"><p class="text-sm font-semibold">Try a scan</p><div class="mt-3 grid gap-2">${mine ? `<button class="btn btn-p" data-scan="mine">Scan your ticket (seat ${mine.seat})</button>` : `<p class="text-sm text-muted">Book a seat on this trip as a student to scan your own ticket.</p>`}<button class="btn btn-o" data-scan="other">Scan another passenger's ticket</button><button class="btn btn-o" data-scan="wrong">Scan a ticket for a different bus</button><button class="btn btn-o" data-scan="bad">Scan something that isn't a MOVA ticket</button></div></div></div>
    ${S.scan ? scanResult(S.scan) : ""}`; },

  operator: () => { const ts = trips.filter(t => t.operator === OP); const pax = ts.reduce((n, t) => n + t.booked.size + S.tickets.filter(k => k.t === t).length, 0);
    return `${appHead("Operator · Ama Demo")}<div class="wrap py-10"><div class="mb-6 flex flex-wrap items-end justify-between gap-3"><div><h1 class="text-2xl font-extrabold sm:text-3xl">Operations overview</h1><p class="mt-1.5 text-muted">${OP} ${demo}</p></div></div>
    <dl class="grid grid-cols-2 rounded-[18px] border border-line bg-surface sm:flex sm:divide-x sm:divide-line">${[["Departing in 24 hours", ts.filter(t => t.dep - Date.now() < 864e5).length], ["Upcoming trips", ts.length], ["Booked passengers", pax], ["Buses", 3]].map(([l, v]) => `<div class="flex-1 px-5 py-4"><dt class="text-sm text-muted">${l}</dt><dd class="tab text-2xl font-bold">${v}</dd></div>`).join("")}</dl>
    <div class="card mt-8 overflow-hidden"><div class="border-b border-line px-5 py-4"><h2 class="text-lg font-bold">Trips</h2></div><div class="overflow-x-auto"><table class="w-full min-w-[720px] text-left text-[15px]"><thead class="border-b border-line bg-ground text-xs font-semibold text-muted uppercase"><tr><th class="px-4 py-3">Departure</th><th class="px-4 py-3">Route</th><th class="px-4 py-3">Bus</th><th class="px-4 py-3 text-right">Fare</th><th class="px-4 py-3 text-right">Booked</th><th class="px-4 py-3"></th></tr></thead>
      <tbody class="divide-y divide-line">${ts.map(t => `<tr><td class="px-4 py-3"><b class="tab">${fmtT(t.dep)}</b><br><span class="text-sm text-muted">${fmtD(t.dep)}</span></td><td class="px-4 py-3 font-semibold">${t.origin} → ${t.destination}</td><td class="px-4 py-3 text-sm">${t.plate}</td><td class="tab px-4 py-3 text-right">${cedis(t.fare)}</td><td class="tab px-4 py-3 text-right">${t.booked.size + S.tickets.filter(k => k.t === t).length} / ${t.cap}</td><td class="px-4 py-3 text-right"><a href="#manifest-${t.id}" class="btn btn-o !min-h-0 h-9 text-sm">Manifest</a></td></tr>`).join("")}</tbody></table></div></div></div>`; },

  manifest: id => { const t = trips.find(x => x.id === id) || trips[0]; const rows = [...t.booked.entries()].map(([seat, p]) => ({ seat, ...p })).concat(S.tickets.filter(k => k.t === t).map(k => ({ seat: k.seat, name: S.user.name, sid: S.user.sid, phone: S.user.phone, lug: k.lug, boarded: k.boarded }))).sort((a, b) => a.seat - b.seat);
    return `${appHead("Operator · Ama Demo")}<div class="wrap py-10"><a href="#operator" class="mb-6 inline-flex items-center gap-1.5 text-sm font-semibold text-muted">${icon(I.back, "size-4")} Trips</a><div class="mb-6 flex flex-wrap items-end justify-between gap-4"><div><p class="text-sm font-semibold text-muted">MOVA passenger manifest ${demo}</p><h1 class="mt-1 text-2xl font-extrabold sm:text-3xl">${t.origin} → ${t.destination}</h1><p class="mt-1 text-[15px] text-muted">${fmtD(t.dep)} at <b class="tab">${fmtT(t.dep)}</b> · ${t.plate}</p></div><p class="tab text-[15px]"><b>${rows.length}</b> passengers · <b>${rows.filter(r => r.boarded).length}</b> boarded</p></div>
    <div class="card overflow-x-auto"><table class="w-full min-w-[720px] text-left text-[15px]"><thead class="border-b border-line bg-ground text-xs font-semibold text-muted uppercase"><tr><th class="px-4 py-3">Seat</th><th class="px-4 py-3">Passenger</th><th class="px-4 py-3">Student ID</th><th class="px-4 py-3">Phone</th><th class="px-4 py-3">Luggage</th><th class="px-4 py-3">Boarding</th></tr></thead>
    <tbody class="divide-y divide-line">${rows.map(r => `<tr><td class="tab px-4 py-2.5 font-display text-lg font-extrabold">${r.seat}</td><td class="px-4 py-2.5 font-semibold">${r.name}</td><td class="tab px-4 py-2.5">${r.sid}</td><td class="tab px-4 py-2.5">${r.phone}</td><td class="px-4 py-2.5">${LUG.find(l => l[0] === r.lug)[1]}</td><td class="px-4 py-2.5">${r.boarded ? '<span class="badge text-success bg-success-bg">Boarded</span>' : '<span class="badge text-muted">Not yet</span>'}</td></tr>`).join("")}</tbody></table></div>
    <p class="mt-4 text-xs text-muted">Sample passengers. Contains personal data protected under Ghana's Data Protection Act, 2012 (Act 843).</p></div>`; },
};

function appHead(who) { const nav = S.role === "driver" ? [["#driver", "My trips"], ["#scan-kum", "Scan tickets"]] : [["#operator", "Overview"]]; return `<header class="border-b border-line bg-surface"><div class="wrap flex h-16 items-center justify-between gap-4"><a href="#home">${logo()}</a><nav class="flex gap-1">${nav.map(([h, l]) => `<a href="${h}" class="rounded-xl px-3 py-2 text-[15px] font-medium text-muted hover:bg-info-bg hover:text-fg">${l}</a>`).join("")}</nav><span class="hidden text-sm text-muted sm:block">${who}</span></div></header>`; }

function ticket(tk) { const qr = qrcode(0, "M"); qr.addData("MOVA1:" + tk.token); qr.make(); const t = tk.t; const lug = LUG.find(l => l[0] === tk.lug)[1];
  return `<article class="mx-auto w-full max-w-sm overflow-hidden rounded-[24px] bg-surface text-left shadow-float ring-1 ring-line"><div class="bg-[linear-gradient(120deg,#493BFF_0%,#8655FF_100%)] px-6 pt-5 pb-6 text-white"><div class="flex justify-between text-sm"><b class="font-display">MOVA</b><span class="text-white/80">${t.type === "shuttle" ? "Campus shuttle" : "Inter-regional"}</span></div><div class="mt-4 grid grid-cols-[1fr_auto_1fr] items-end gap-3"><div><p class="text-xs text-white/75">From</p><p class="font-display text-lg leading-tight font-bold">${t.origin}</p></div><span class="mb-2 h-0.5 w-12 bg-[repeating-linear-gradient(90deg,#12D6C5_0_4px,transparent_4px_7px)]"></span><div class="text-right"><p class="text-xs text-white/75">To</p><p class="font-display text-lg leading-tight font-bold">${t.destination}</p></div></div></div>
  <div class="px-6 pt-6 pb-5"><div class="flex items-start justify-between"><div><p class="text-xs text-muted">Passenger</p><b>${S.user.name}</b></div>${tk.boarded ? '<span class="badge text-muted">Boarded</span>' : '<span class="badge text-success bg-success-bg">Confirmed</span>'}</div>
  <dl class="mt-5 grid grid-cols-3 gap-4"><div><dt class="text-xs text-muted">Date</dt><dd class="font-semibold">${fmtD(t.dep)}</dd></div><div><dt class="text-xs text-muted">Departs</dt><dd class="tab font-semibold">${fmtT(t.dep)}</dd></div><div><dt class="text-xs text-muted">Seat</dt><dd class="tab font-display text-2xl leading-none font-extrabold text-accent-fg">${tk.seat}</dd></div><div class="col-span-2"><dt class="text-xs text-muted">Bus</dt><dd class="font-semibold">${t.plate}</dd></div><div><dt class="text-xs text-muted">Luggage</dt><dd class="font-semibold">${lug}</dd></div></dl></div>
  <div class="mx-6 border-t-2 border-dashed border-line"></div><div class="flex flex-col items-center px-6 pt-5 pb-6"><div role="img" aria-label="QR code for ticket MOVA-${tk.ref}" class="size-52 rounded-2xl bg-white p-3 [&_svg]:h-full [&_svg]:w-full ${tk.boarded ? "opacity-40" : ""}">${qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true })}</div><p class="mt-3 text-center text-sm text-muted">${tk.boarded ? "This ticket has been used." : "Show this QR code to the driver of your bus when you board."}</p>
  <dl class="mt-4 grid w-full grid-cols-2 gap-3 border-t border-line pt-4 text-sm"><div><dt class="text-xs text-muted">Booking reference</dt><dd class="tab font-semibold">MOVA-${tk.ref}</dd></div><div class="text-right"><dt class="text-xs text-muted">Paid (test)</dt><dd class="tab font-semibold">${cedis(tk.amt)}</dd></div></dl></div></article>`; }

function scanResult(r) { const m = { valid: ["#0a7f75", "Valid ticket", "Ticket valid. Passenger boarded.", I.check], used: ["#8a5a00", "Already used", "This ticket has already been used.", I.x], wrong: ["#8a5a00", "Wrong bus", "This ticket is for a different trip or bus.", I.x], bad: ["#c4283b", "Invalid ticket", "This isn't a valid MOVA ticket.", I.x] }[r.code];
  return `<div role="alertdialog" aria-modal="true" aria-labelledby="sr-t" class="fixed inset-0 z-[60] flex flex-col items-center justify-center p-8 text-center text-white" style="background:${m[0]}">${icon(m[3], "size-28")}<h2 id="sr-t" class="mt-6 font-display text-5xl font-extrabold">${m[1]}</h2><p class="mt-3 max-w-sm text-lg text-white/90">${m[2]}</p>${r.p ? `<div class="mt-8 rounded-2xl bg-white/15 px-6 py-4 text-left"><p class="text-sm text-white/80">Passenger</p><p class="text-xl font-bold">${r.p.name}</p><p class="tab mt-1 text-lg">Seat ${r.p.seat} · ${r.p.route}</p></div>` : ""}<button data-scan-close class="mt-10 h-14 w-full max-w-xs rounded-2xl bg-white text-lg font-bold text-ink">Scan next ticket</button></div>`; }

// ---------- routing & state ----------
const roleHome = { student: "home", driver: "driver", operator: "operator" };
function render() {
  const h = (location.hash || "#home").slice(1);
  const [page, ...rest] = h.split("-"); const arg = rest.join("-");
  const map = { home: () => pages.home(), trips: () => pages.trips(), trip: () => pages.trip(arg), checkout: () => pages.checkout(), pending: () => pages.pending(), failed: () => pages.failed(), confirmed: () => pages.confirmed(), tickets: () => pages.tickets(), ticket: () => pages.ticket(arg), help: () => pages.help(), driver: () => pages.driver(), scan: () => pages.scan(arg), operator: () => pages.operator(), manifest: () => pages.manifest(arg) };
  document.getElementById("app").innerHTML = `<div class="view">${(map[page] || map.home)()}</div>`;
  document.getElementById("roles").innerHTML = [["student", "Student"], ["driver", "Driver"], ["operator", "Operator"]].map(([r, l]) => `<button data-role="${r}" class="rounded-full px-3 py-1 font-semibold ${S.role === r ? "bg-white text-ink" : "text-white/80 hover:bg-white/10"}">${l}</button>`).join("");
  if (page === "home" && arg === "how") document.getElementById("home-how")?.scrollIntoView(); else window.scrollTo(0, 0);
  const th = document.documentElement.dataset.theme; document.querySelectorAll("[data-theme-set]").forEach(b => { const on = b.dataset.themeSet === (th || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")); b.className = `rounded-full px-3 py-1.5 capitalize ${on ? "bg-electric text-white" : "text-muted"}`; b.setAttribute("aria-checked", on); b.setAttribute("role", "radio"); });
  drawHold();
}
function drawHold() {
  clearInterval(timer); const el = document.getElementById("hold"); if (!el || !S.hold) return;
  const tick = () => { const left = Math.max(0, S.hold.until - Date.now()); const s = Math.ceil(left / 1000), urgent = left < 12e4, pct = left / 6e5 * 100;
    el.className = `rounded-2xl p-3.5 ${urgent ? "bg-warning-bg" : "bg-success-bg"}`;
    el.innerHTML = `<div class="flex items-center gap-3">${icon(I.timer, `size-5 ${urgent ? "text-warning" : "text-success"}`)}<p class="flex-1 text-sm"><b>Your seat is held</b> while you complete payment.</p><span role="timer" class="tab font-display text-xl font-extrabold ${urgent ? "text-warning" : "text-success"}">${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}</span></div><div class="relative mt-3 ml-8 h-2"><span class="absolute inset-x-0 inset-y-[3px] rounded-full bg-[repeating-linear-gradient(90deg,var(--border)_0_5px,transparent_5px_9px)]"></span><span class="absolute inset-y-[2px] left-0 rounded-full ${urgent ? "bg-sun" : "bg-aqua"}" style="width:${pct}%"></span><span class="absolute top-1/2 size-3 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 bg-surface ${urgent ? "border-sun" : "border-aqua"}" style="left:${pct}%"></span></div>`;
    if (left <= 0) { S.hold = null; S.expired = true; render(); } };
  tick(); timer = setInterval(tick, 1000);
}
addEventListener("hashchange", render);
document.addEventListener("click", e => {
  const b = e.target.closest("button, a"); if (!b) return; const d = b.dataset;
  if (d.role) { S.role = d.role; location.hash = roleHome[d.role]; render(); }
  else if (d.step) { S.step = +d.step; render(); }
  else if (d.filter !== undefined) { S.type = d.filter; render(); }
  else if (d.type) { S.type = d.type; }
  else if ("clear" in d) { S.search = {}; S.type = ""; render(); }
  else if (d.seat) { const id = location.hash.slice(6); S.expired = false; S.hold = { trip: id, seat: d.seat, until: Date.now() + 6e5, ref: Math.random().toString(36).slice(2, 10).toUpperCase() }; render(); }
  else if ("release" in d) { S.hold = null; render(); }
  else if (d.go === "checkout") { location.hash = "checkout"; }
  else if (d.pay) { if (d.pay === "failed") { location.hash = "failed"; return; } location.hash = "pending";
    setTimeout(() => { const t = trips.find(x => x.id === S.hold.trip); S.tickets.unshift({ ref: S.hold.ref, t, seat: S.hold.seat, lug: S.lug, amt: t.fare + LUG.find(l => l[0] === S.lug)[2], token: crypto.getRandomValues(new Uint32Array(4)).join(""), boarded: false }); S.hold = null; S.lug = "none"; location.hash = "confirmed"; }, 1800); }
  else if (d.scan) { const t = trips.find(x => x.id === location.hash.slice(6)) || trips[1]; const route = `${t.origin} → ${t.destination}`;
    if (d.scan === "mine") { const k = S.tickets.find(x => x.t === t); S.scan = k.boarded ? { code: "used", p: { name: S.user.name, seat: k.seat, route } } : { code: "valid", p: { name: S.user.name, seat: k.seat, route } }; k.boarded = true; }
    else if (d.scan === "other") { const e2 = [...t.booked.entries()].find(([, p]) => !p.boarded) || [...t.booked.entries()][0]; S.scan = e2[1].boarded ? { code: "used", p: { name: e2[1].name, seat: e2[0], route } } : { code: "valid", p: { name: e2[1].name, seat: e2[0], route } }; e2[1].boarded = true; }
    else if (d.scan === "wrong") S.scan = { code: "wrong", p: { name: "Yaw Boateng", seat: "12", route: "Cape Coast (UCC) → Accra" } };
    else S.scan = { code: "bad" }; render(); }
  else if ("scanClose" in d) { S.scan = null; render(); }
  else if (d.themeSet) { document.documentElement.dataset.theme = d.themeSet; render(); }
});
document.addEventListener("change", e => { if (e.target.name === "lug") { S.lug = e.target.value; render(); } });
document.addEventListener("submit", e => { e.preventDefault(); if (e.target.dataset.form === "search") { const f = new FormData(e.target); S.search = { origin: f.get("origin").trim(), destination: f.get("destination").trim(), date: f.get("date") }; location.hash = "trips"; render(); } });
render();
}
</script>
</body>
</html>
