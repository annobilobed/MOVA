# Local services for MOVA development.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mova
      POSTGRES_PASSWORD: mova
      POSTGRES_DB: mova
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
